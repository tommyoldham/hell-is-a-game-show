<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hell Is a Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12060a;
  --panel: #1f0b11;
  --panel2: #2a0f17;
  --line: #4a1a24;
  --text: #f5e9e4;
  --muted: #b99a96;
  --fire: #ff4b2b;
  --gold: #ffb627;
  --good: #7dff6a;
  --bad: #ff4b4b;
  --ink: #1a0508;
  --px: 'Press Start 2P', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(ellipse at top, #3a0c14 0%, var(--bg) 70%) fixed var(--bg);
  color: var(--text);
  font: 22px/1.25 VT323, 'Courier New', monospace;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
#app { max-width: 1040px; margin: 0 auto; padding: 12px 16px 48px; }

/* ------------------------------------------------------------ logo + bars */
.logo { font-family: var(--px); text-align: center; line-height: 1.15; margin: 18px 0 6px; }
.logo span { display: block; font-size: clamp(22px, 6vw, 44px); color: var(--gold); text-shadow: 3px 3px 0 var(--fire), 6px 6px 0 var(--ink); }
.logo span + span { color: var(--fire); text-shadow: 3px 3px 0 var(--gold), 6px 6px 0 var(--ink); }
.logo.small { margin: 0; text-align: left; }
.logo.small span { font-size: 11px; text-shadow: 2px 2px 0 var(--ink); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 10px; }
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.tag { text-align: center; color: var(--muted); margin: 0 0 14px; }
.netbar { padding: 8px 12px; margin-bottom: 10px; border: 2px solid var(--line); background: var(--panel2); color: var(--muted); }
.netbar.error { border-color: var(--bad); color: #ffd0d0; }
.netbar.offline, .netbar.connecting { border-color: var(--gold); }
.fine { color: var(--muted); font-size: 19px; }
.center { text-align: center; }
.block { display: block; margin: 12px auto; }
.waiting { color: var(--gold); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.hot { color: var(--fire); }
.glow { color: var(--gold); }
.money { color: var(--gold); font-family: var(--px); font-size: 12px; }
.pill { font-family: var(--px); font-size: 9px; padding: 4px 6px; background: var(--fire); color: var(--ink); vertical-align: middle; }
.pill.dim { background: var(--line); color: var(--muted); }

/* ------------------------------------------------------------ pixel boxes */
.card, .panel {
  background: var(--panel);
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--ink);
  padding: 16px;
  margin: 0 0 18px;
}
h1, h2, h3 { font-family: var(--px); font-weight: 400; line-height: 1.4; }
h1 { font-size: clamp(16px, 4vw, 24px); margin: 4px 0 14px; }
h2 { font-size: 13px; margin: 0 0 12px; color: var(--gold); }
h3 { font-size: 10px; margin: 16px 0 8px; color: var(--muted); }

button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
.big, .small {
  border: 3px solid var(--ink);
  background: var(--panel2);
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.35), inset 3px 3px 0 rgba(255,255,255,.08);
  padding: 12px 16px;
  font-family: var(--px);
  font-size: 12px;
  line-height: 1.4;
}
.big { width: 100%; padding: 16px; font-size: 14px; }
.small { padding: 8px 10px; font-size: 10px; }
.big:not(:disabled):hover, .small:not(:disabled):hover { filter: brightness(1.2); }
.big:not(:disabled):active, .small:not(:disabled):active { transform: translate(2px, 2px); }
.fire { background: var(--fire); color: var(--ink); }
.chosen { outline: 3px solid var(--gold); outline-offset: 2px; }
.link { background: none; border: 0; color: var(--gold); text-decoration: underline; padding: 4px; }
.iconbtn { background: none; border: 0; font-size: 22px; padding: 2px 4px; }

input, select {
  background: var(--bg);
  border: 3px solid var(--line);
  padding: 8px 10px;
  width: 100%;
  border-radius: 0;
}
input:focus, select:focus { outline: 3px solid var(--fire); outline-offset: 0; border-color: var(--ink); }
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; color: var(--muted); margin-bottom: 4px; }
.field.inline { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; }
.field.inline > span { margin: 0; white-space: nowrap; }

/* ------------------------------------------------------------ home */
.home { max-width: 560px; margin: 0 auto; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; background: var(--c); border: 3px solid var(--ink); }
.swatch.on { outline: 3px solid var(--gold); outline-offset: 2px; }
.or { text-align: center; color: var(--muted); margin: 14px 0 8px; }
.joinrow { display: flex; gap: 10px; }
.joinrow input { text-transform: uppercase; font-family: var(--px); font-size: 16px; text-align: center; letter-spacing: 4px; }
.joinrow .big { width: auto; }
.bigcode.inline { display: inline-block; font-size: 26px; letter-spacing: 4px; margin: 0 4px; vertical-align: middle; }
.invite .card { display: grid; gap: 10px; text-align: left; }
.invite .card h2, .invite .card > p { text-align: center; margin: 0; }
.invite .link { justify-self: center; }

/* ------------------------------------------------------------ lobby */
.lobby { max-width: 640px; margin: 0 auto; }
.card.code { text-align: center; }
.bigcode { font-family: var(--px); font-size: 40px; letter-spacing: 8px; color: var(--gold); text-shadow: 4px 4px 0 var(--fire); margin: 8px 0; }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.players li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.players li.gone { opacity: .45; }
.players i, .standings i, .chip i { width: 16px; height: 16px; background: var(--c); border: 2px solid var(--ink); flex: none; display: inline-block; }
.players em { color: var(--muted); font-style: normal; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lobby.wide { max-width: 860px; }
.check { display: flex; gap: 8px; align-items: baseline; margin-top: 12px; }
.check input { width: auto; }
.catlist { display: flex; flex-wrap: wrap; gap: 6px; }
.catlist span { padding: 4px 8px; background: #241046; border: 2px solid #4a2a8a; }
.rules ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* ------------------------------------------------------------ board editor */
.etools { display: flex; flex-wrap: wrap; gap: 6px; }
.filebtn { cursor: pointer; display: inline-block; }
.etabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; }
.etabs button { background: var(--panel2); border: 3px solid var(--line); border-bottom: 0; padding: 6px 10px; font-size: 19px; }
.etabs button.on { border-color: var(--fire); background: #3d1018; }
.ebody { border: 3px solid var(--fire); padding: 12px; background: #180810; display: grid; gap: 12px; }
.erow { display: flex; gap: 8px; }
.ecell { display: grid; grid-template-columns: 34px 1fr; gap: 6px 10px; align-items: start; }
.ecell > b { grid-row: span 3; font-family: var(--px); font-size: 16px; color: var(--gold); padding-top: 8px; text-align: center; }
.ecell .check { margin: 0; font-size: 18px; color: var(--muted); }
textarea {
  background: var(--bg); border: 3px solid var(--line); padding: 8px 10px; width: 100%;
  font: inherit; color: inherit; resize: vertical; border-radius: 0;
}
textarea:focus { outline: 3px solid var(--fire); border-color: var(--ink); }

/* ------------------------------------------------------------ the stage */
.stage { position: relative; margin: 0 0 16px; border: 3px solid var(--ink); box-shadow: 0 0 0 3px var(--line), 0 0 40px rgba(255,75,43,.25); background: #000; }
.stage canvas { display: block; width: 100%; aspect-ratio: 320 / 150; image-rendering: pixelated; image-rendering: crisp-edges; }
.bubble {
  position: absolute; left: 25%; top: 22%; max-width: 46%;
  background: #fff6e8; color: var(--ink);
  border: 3px solid var(--ink);
  padding: 6px 10px;
  font-size: clamp(15px, 2.3vw, 22px);
  line-height: 1.1;
  box-shadow: 4px 4px 0 rgba(0,0,0,.5);
}
.bubble::before {
  content: ''; position: absolute; left: -12px; top: 40%;
  border: 6px solid transparent; border-right-color: var(--ink);
  border-width: 6px 9px 6px 3px;
}
.home .stage .bubble { display: none; }
.stage { container-type: inline-size; overflow: hidden; }

/* Name plates: real little placards bolted under each podium. */
.plates, .floats { position: absolute; inset: 0; pointer-events: none; }
.plate {
  position: absolute; top: 77%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 0.3cqw;
  padding: 0.5cqw 0.4cqw 0.6cqw;
  background: #1a0b11; border: 0.45cqw solid var(--ink);
  box-shadow: inset 0 0 0 0.35cqw var(--c, var(--line)), 0 0.6cqw 0 rgba(0,0,0,.5);
  color: var(--text); line-height: 1; min-width: 0;
}
.plate::before, .plate::after { /* rivets */
  content: ''; position: absolute; top: 0.6cqw; width: 0.6cqw; height: 0.6cqw; background: #6b4a12;
}
.plate::before { left: 0.6cqw; }
.plate::after { right: 0.6cqw; }
.plate span { max-width: 100%; padding: 0 0.8cqw; font-size: max(10px, 2.5cqw); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plate b { font-family: var(--px); font-weight: 400; font-size: max(7px, 1.7cqw); color: var(--gold); }
.plate.me { border-color: var(--gold); }
.plate.gone { opacity: .45; }
.plate.host { box-shadow: inset 0 0 0 0.35cqw var(--fire), 0 0.6cqw 0 rgba(0,0,0,.5); }
.plate.host b { color: var(--fire); }
.float {
  position: absolute; top: 44%; transform: translateX(-50%);
  font-family: var(--px); font-size: max(12px, 3.4cqw); text-shadow: 0.4cqw 0.4cqw 0 var(--ink);
  animation: floatUp 1.5s ease-out forwards;
}
.float.good { color: var(--good); }
.float.bad { color: var(--bad); }
@keyframes floatUp { 0% { opacity: 0; translate: 0 2cqw; scale: .5; } 15% { opacity: 1; scale: 1.3; } 30% { scale: 1; } 100% { opacity: 0; translate: 0 -10cqw; } }

/* Big announcements. */
#splash { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; pointer-events: none; }
#splash.show { display: grid; animation: splashBg var(--ms, 1500ms) ease-out forwards; }
#splash .sp {
  text-align: center; padding: 22px 34px; max-width: 92vw;
  background: var(--fire); color: #fff6e8; border: 6px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink), 0 0 0 6px var(--gold);
  rotate: -3deg;
  animation: splashIn var(--ms, 1500ms) cubic-bezier(.2, 1.6, .4, 1) forwards;
}
#splash b { display: block; font-family: var(--px); font-weight: 400; font-size: clamp(22px, 7vw, 56px); line-height: 1.1; text-shadow: 4px 4px 0 var(--ink); overflow-wrap: anywhere; }
#splash span { display: block; margin-top: 10px; font-size: clamp(20px, 3.5vw, 30px); }
#splash.good .sp { background: #2e8a28; }
#splash.bad .sp { background: #a81c1c; rotate: 3deg; }
#splash.buzz .sp { background: var(--gold); color: var(--ink); }
#splash.buzz b { text-shadow: 4px 4px 0 #fff6e8; }
#splash.cat .sp { background: #241046; box-shadow: 10px 10px 0 var(--ink), 0 0 0 6px #4a2a8a; rotate: 0deg; }
#splash.fraud .sp { background: var(--ink); color: var(--fire); box-shadow: 10px 10px 0 #000, 0 0 0 6px var(--fire); }
#splash.robin .sp { background: #3d1018; }
#splash.win .sp { background: var(--gold); color: var(--ink); }
#splash.win b { text-shadow: 4px 4px 0 var(--fire); }
@keyframes splashIn { 0% { scale: .2; opacity: 0; } 12% { scale: 1.08; opacity: 1; } 20% { scale: 1; } 82% { scale: 1; opacity: 1; } 100% { scale: 1.2; opacity: 0; } }
@keyframes splashBg { 0% { background: rgba(0,0,0,0); } 12% { background: rgba(10,0,4,.55); } 82% { background: rgba(10,0,4,.55); } 100% { background: rgba(0,0,0,0); } }

/* Scene entrances. */
.enter { animation: popIn .45s cubic-bezier(.2, 1.5, .4, 1) both; }
.deal { animation: dealIn .35s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes dealIn { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .enter, .deal, #splash .sp, #splash.show, .float { animation-duration: 1ms !important; }
}
.toggles { display: inline-flex; gap: 2px; }
.iconbtn.off { opacity: .35; }
.etabs select { width: auto; padding: 4px 8px; font-size: 19px; border-bottom: 0; }

/* ------------------------------------------------------------ game */
.panel { min-height: 180px; }
.banner { text-align: center; background: #3d1018; border: 2px solid var(--fire); padding: 6px; margin: 0 0 10px; }
.pickline { margin: 0 0 12px; }
.board { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 6px; }
.bhead {
  display: flex; align-items: center; justify-content: center; text-align: center;
  min-height: 56px; padding: 6px 4px; background: #241046; border: 3px solid var(--ink);
  box-shadow: inset 0 0 0 2px #4a2a8a; font-size: 20px; line-height: 1; overflow-wrap: anywhere;
}
.bhead.robin { background: #3d1018; box-shadow: inset 0 0 0 2px var(--fire); }
.bhead { flex-direction: column; gap: 3px; }
.bhead small { font-size: 15px; color: var(--gold); line-height: 1; }
.brow .bhead { align-items: flex-start; }
.players .spec { flex-basis: 100%; padding-left: 24px; font-size: 18px; color: var(--gold); }
.players .spec em { color: var(--muted); }
.specpick { border-color: var(--gold); }
.specpick select { font-size: 22px; }
.myspec { margin: 10px 0 0; color: var(--gold); }
.bcell {
  min-height: 52px; background: #1a0b33; border: 3px solid var(--ink); box-shadow: inset 0 0 0 2px #2f1a5c;
  font-family: var(--px); font-size: 20px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink);
}
.bcell:not(:disabled):hover { box-shadow: inset 0 0 0 3px var(--gold); filter: brightness(1.3); }
.bcell:disabled { opacity: 1; cursor: default; }
.bcell.robin { color: var(--fire); }
.bcell.gone { background: transparent; border: 3px dashed #2a1520; box-shadow: none; }
.bcell.none { visibility: hidden; }
/* Phones get the board on its side: one row per category. */
.blist { display: none; gap: 4px; }
.brow { display: grid; grid-template-columns: minmax(90px, 1.6fr) repeat(5, minmax(0, 1fr)); gap: 4px; }
.brow .bhead { justify-content: flex-start; text-align: left; min-height: 44px; padding: 4px 8px; font-size: 18px; }
.brow .bcell { min-height: 44px; font-size: 14px; }
@media (max-width: 760px) {
  .board { display: none; }
  .blist { display: grid; }
}
.qhead { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 18px; margin-bottom: 8px; }
.question { font-family: VT323, monospace; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; color: var(--text); margin: 0 0 14px; }
.qpanel.fraud { border-color: var(--fire); }
.fraudbanner { text-align: center; font-family: var(--px); font-size: 14px; color: var(--fire); margin: 0 0 12px; animation: blink .6s steps(2) 6; }
.fraudbanner span { display: block; font-family: VT323, monospace; font-size: 19px; color: var(--muted); margin-top: 6px; }
.listen { font-size: 28px; color: var(--muted); margin: 10px 0 16px; }
.reveal { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: #13361a; border: 3px solid #2e6a2a; margin-bottom: 12px; }
.reveal span { font-size: 16px; color: var(--muted); }
.reveal b { font-size: 26px; font-weight: 400; color: var(--good); }
.reveal.host { background: #0f2914; }
.buzzed { text-align: center; font-family: var(--px); font-size: clamp(16px, 4vw, 26px); color: var(--gold); margin: 6px 0 10px; animation: blink .3s steps(2) 3; }
.buzzed.me { color: var(--fire); }
.buzzed span { display: block; font-family: VT323, monospace; font-size: 22px; color: var(--text); margin-top: 6px; }
.buzzer {
  display: block; width: min(260px, 70vw); aspect-ratio: 1; margin: 6px auto 4px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ff8a6a, var(--fire) 45%, #9c1a10);
  border: 6px solid var(--ink); box-shadow: 0 10px 0 #5a0d08, 0 0 0 6px #3a0a10, 0 0 50px rgba(255,75,43,.4);
  font-family: var(--px); font-size: clamp(22px, 6vw, 34px); color: #fff6e8; text-shadow: 3px 3px 0 var(--ink);
  touch-action: manipulation; user-select: none;
}
.buzzer:not(:disabled):active { transform: translateY(8px); box-shadow: 0 2px 0 #5a0d08, 0 0 0 6px #3a0a10; }
.buzzer:disabled { background: radial-gradient(circle at 35% 30%, #6a5050, #3a2228 60%); box-shadow: 0 10px 0 #1a0a0f, 0 0 0 6px #2a0f17; color: var(--muted); font-size: clamp(14px, 3.5vw, 18px); opacity: 1; }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
.big.good { background: #2e8a28; color: #fff; }
.big.bad { background: #a81c1c; color: #fff; }
.deskrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.result { font-family: var(--px); font-size: 13px; margin: 10px 0; }
.result.good { color: var(--good); }
.result.bad { color: var(--bad); }
.turns { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 12px; }
.turns li { padding: 6px 12px; border: 3px solid var(--line); background: var(--panel2); }
.turns li.now { border-color: var(--gold); color: var(--gold); }
.turns li.out { opacity: .4; text-decoration: line-through; }
.rowform { display: flex; gap: 8px; max-width: 460px; margin: 10px auto; }
.rowform input { flex: 1; font-size: 24px; }
.rowform .big { width: auto; }
.finals { display: grid; gap: 8px; max-width: 460px; margin: 0 auto; }
.finalans { list-style: none; padding: 0; margin: 10px auto; max-width: 520px; display: grid; gap: 6px; text-align: left; }
.finalans li { padding: 8px 10px; border: 2px solid var(--line); background: var(--panel2); }
.finalans li.now { border-color: var(--gold); }
.finalans li.good { border-color: var(--good); }
.finalans li.bad { border-color: var(--bad); }
@keyframes blink { 50% { filter: brightness(1.8); } }

.standings { list-style: none; padding: 0; margin: 0 auto 14px; max-width: 460px; display: grid; gap: 6px; }
.standings li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--panel2); border: 2px solid var(--line); }
.standings li.me { border-color: var(--gold); }
.standings .rank { font-family: var(--px); font-size: 12px; width: 22px; color: var(--muted); }
.standings .nm { flex: 1; text-align: left; }
.standings li:first-child .rank { color: var(--gold); }

.scorebar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--panel); border: 2px solid var(--line); font-size: 20px; }
.chip.me { border-color: var(--gold); }
.chip.gone { opacity: .45; }
.chip.buzzing { border-color: var(--fire); box-shadow: 0 0 12px var(--fire); }
.chip b { font-family: var(--px); font-size: 11px; color: var(--gold); font-weight: 400; }
.tiny { background: var(--panel2); border: 2px solid var(--line); width: 26px; height: 26px; padding: 0; line-height: 1; }
.tiny:hover { border-color: var(--gold); }

.hostdesk { border-color: var(--fire); }
.hostdesk h3:first-child { margin-top: 0; color: var(--fire); }
.cues { display: grid; gap: 6px; }
.cue { text-align: left; background: var(--panel2); border: 2px solid var(--line); padding: 8px 10px; font-size: 20px; }
.cue:hover { border-color: var(--gold); }
.sounds { display: flex; flex-wrap: wrap; gap: 6px; }

/* ------------------------------------------------------------ toasts */
#toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: grid; gap: 6px; z-index: 50; width: min(92vw, 420px); }
.toast { background: var(--panel2); border: 3px solid var(--gold); padding: 8px 12px; text-align: center; box-shadow: 4px 4px 0 var(--ink); transition: opacity .4s; }
.toast.bad { border-color: var(--bad); }
.toast.out { opacity: 0; }

@media (max-width: 760px) {
  body { font-size: 20px; }
  .bhead { font-size: 15px; min-height: 48px; }
  .bcell { font-size: 14px; min-height: 44px; }
  .board { gap: 3px; }
  .ecell { grid-template-columns: 24px 1fr; }
  .judge { grid-template-columns: 1fr; }
  .bubble { top: 6%; left: 25%; max-width: 50%; padding: 4px 6px; }
  .bigcode { font-size: 32px; }
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>

    { cat: 'Video game movies', q: 'What was the first live-action feature film based on a video game to get a theatrical release?', a: 'Super Mario Bros. (1993). Tron is NOT right: the Tron game was based on the film.' },
    { cat: 'The Devil in music', q: 'Which Rolling Stones song begins "Please allow me to introduce myself"?', a: '"Sympathy for the Devil"' },
    { cat: 'Firsts', q: 'Who was the first woman to win a Nobel Prize?', a: 'Marie Curie (Physics, 1903)' },
    { cat: 'Box office', q: 'What was the first film to make more than $2 billion worldwide?', a: 'Avatar (2009). Titanic only passed $2 billion after its 2012 re-release.' },
    { cat: 'Aussie radio', q: 'What was the first song played on Double J (now Triple J) when it launched in 1975?', a: '"You Just Like Me \'Cos I\'m Good in Bed" by Skyhooks' },
    { cat: 'Arcades', q: 'What was Atari\'s first big hit arcade game, released in 1972?', a: 'Pong' },
    { cat: 'Dante\'s Inferno', q: 'In Dante\'s Inferno, which circle of Hell punishes the gluttonous?', a: 'The third circle' },
    { cat: 'Long-running TV', q: 'What is the longest-running American scripted primetime TV series?', a: 'The Simpsons' },
    { cat: 'Planets', q: 'Which planet has a day that is longer than its year?', a: 'Venus (a day is about 243 Earth days; a year is about 225)' },
  ];

  const STARTER = { title: 'Starter board', cats: CATS.slice(0, 5), robins: ROBINS.slice(0, 3), finals: FINALS.slice(0, 3) };
  const LIBRARY = { cats: CATS, robins: ROBINS, finals: FINALS };

  const api = { STARTER, LIBRARY };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.HGS_Q = api;

<script>
// Hell Is a Game Show: the rules engine. Pure functions over plain JSON, so the
// room owner's browser runs it and node tests can drive it without a DOM.
//
// The format follows a host-run buzzer show: a board of categories worth 1-5
// points, control of the board, buzz-in with spoken answers the host rules on
// (wrong answers cost points), "fraud" statements worth double, round robins
// scored by finishing place, and a final gamble with secret wagers.
(function (root) {
  'use strict';
  const Q = (typeof module !== 'undefined' && module.exports) ? require('./questions.js') : root.HGS_Q;
  const STARTER = Q.STARTER, LIBRARY = Q.LIBRARY;

  const POINTS = [1, 2, 3, 4, 5];
  const ROBIN_POINTS = { winner: 5, runnerUp: 2 };
  const LIMITS = { cats: 8, robins: 4, finals: 3, q: 300, a: 300, name: 30 };

  // ---------------------------------------------------------------- helpers
  function str(v, n) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, n); }
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Normalises a board from the editor (or a file). Blank cells stay blank and
  // are simply missing from the show.
  function cleanBoard(b) {
    b = b && typeof b === 'object' ? b : {};
    const cats = (Array.isArray(b.cats) ? b.cats : []).slice(0, LIMITS.cats).map(c => ({
      name: str(c && c.name, LIMITS.name),
      tag: str(c && c.tag, 30),
      cells: POINTS.map((_, r) => {
        const x = c && Array.isArray(c.cells) ? c.cells[r] : null;
        return { q: str(x && x.q, LIMITS.q), a: str(x && x.a, LIMITS.a), fraud: !!(x && x.fraud) };
      }),
    }));
    const robins = (Array.isArray(b.robins) ? b.robins : []).slice(0, LIMITS.robins).map(x => ({ q: str(x && x.q, LIMITS.q), a: str(x && x.a, LIMITS.a) }));
    const finals = (Array.isArray(b.finals) ? b.finals : []).slice(0, LIMITS.finals).map(x => ({ cat: str(x && x.cat, LIMITS.name), q: str(x && x.q, LIMITS.q), a: str(x && x.a, LIMITS.a) }));
    return { title: str(b.title, 40), cats, robins, finals };
  }

  // A fresh board drawn from the library: six categories, three round robins, three finals.
  function randomBoard(rng, nCats = 6) {
    const pick = (arr, n) => clone(shuffle(arr, rng).slice(0, n));
    return { title: 'Random board', cats: pick(LIBRARY.cats, nCats), robins: pick(LIBRARY.robins, 3), finals: pick(LIBRARY.finals, 3) };
  }

  // Puts each contestant's specialty category on the board, labelled with their
  // name ("Jay's pick"), ahead of the host's own categories. Two players with the
  // same specialty share one column. The board is capped at LIMITS.cats wide, so
  // the host's last categories make way if needed.
  function withSpecialties(board, players, hostId) {
    const b = cleanBoard(board);
    const picks = [];
    for (const p of players) {
      if (p.id === hostId || !p.spec) continue;
      const lib = LIBRARY.cats.find(c => c.name === p.spec);
      if (!lib) continue;
      let e = picks.find(x => x.name === lib.name);
      if (!e) picks.push(e = { name: lib.name, who: [] });
      e.who.push(p.name);
    }
    if (!picks.length) return b;
    const special = picks.map(e => {
      const base = b.cats.find(c => c.name === e.name) || clone(LIBRARY.cats.find(c => c.name === e.name));
      return Object.assign({}, base, { tag: e.who.join(' & ') + "'s pick" });
    });
    const rest = b.cats.filter(c => !picks.some(e => e.name === c.name));
    return cleanBoard(Object.assign({}, b, { cats: special.concat(rest).slice(0, LIMITS.cats) }));
  }

  // How much of a board is actually playable.
  function boardStats(b) {
    const questions = b.cats.reduce((n, c) => n + c.cells.filter(x => x.q).length, 0);
    return { questions, robins: b.robins.filter(x => x.q).length, finals: b.finals.filter(x => x.q).length };
  }

  // ---------------------------------------------------------------- setup
  // room: { showHostId, showText, board, players: [{id, name}] }
  function createGame(room, rng, now) {
    const contestants = room.players.filter(p => p.id !== room.showHostId).map(p => p.id);
    const board = cleanBoard(room.board);
    const used = {};
    board.cats.forEach((c, ci) => c.cells.forEach((x, r) => { if (!x.q) used[ci + '-' + r] = true; }));
    board.robins.forEach((x, k) => { if (!x.q) used['rr-' + k] = true; });
    return {
      hostId: room.showHostId,
      showText: !!room.showText,
      contestants,
      names: Object.fromEntries(room.players.map(p => [p.id, p.name])),
      scores: Object.fromEntries(contestants.map(id => [id, 0])),
      board,
      used,
      control: null,
      phase: 'guess',
      opening: { secret: 1 + Math.floor(rng() * 100), guesses: {}, winner: null },
      cell: null,
      buzz: null,
      buzzes: [],          // [{pid, at}] in the order the room owner received them
      lockedOut: [],
      last: null,          // {pid, ok, delta} from the latest ruling
      robin: null,
      final: null,
      say: { text: '', at: now },
      seq: 0,
    };
  }

  function bump(g) { g.seq++; }
  function isHost(g, pid) { return pid === g.hostId; }
  function isContestant(g, pid) { return g.contestants.includes(pid); }

  function cellOf(g, cell) {
    if (!cell) return null;
    if (cell.robin != null) return g.board.robins[cell.robin] || null;
    const c = g.board.cats[cell.c];
    return c ? c.cells[cell.r] : null;
  }
  function cellKey(cell) { return cell.robin != null ? 'rr-' + cell.robin : cell.c + '-' + cell.r; }
  function cellValue(g) {
    const x = cellOf(g, g.cell);
    return g.cell && g.cell.robin == null ? POINTS[g.cell.r] * (x && x.fraud ? 2 : 1) : 0;
  }
  function boardLeft(g) {
    let n = 0;
    g.board.cats.forEach((c, ci) => c.cells.forEach((x, r) => { if (!g.used[ci + '-' + r]) n++; }));
    g.board.robins.forEach((x, k) => { if (!g.used['rr-' + k]) n++; });
    return n;
  }

  function standings(g) {
    return g.contestants.map(id => ({ id, name: g.names[id], score: g.scores[id] || 0 })).sort((a, b) => b.score - a.score);
  }

  // ---------------------------------------------------------------- phases
  function resolveOpening(g) {
    const o = g.opening;
    let best = null;
    for (const pid of g.contestants) {
      const n = o.guesses[pid];
      if (n == null) continue;
      const d = Math.abs(n - o.secret);
      if (!best || d < best.d) best = { pid, d };
    }
    o.winner = best ? best.pid : g.contestants[0];
    g.control = o.winner;
    g.phase = 'board';
  }

  function pickCell(g, cell) {
    if (cell.robin != null) {
      // Turn order starts with whoever picked it and goes round the room.
      const start = Math.max(0, g.contestants.indexOf(g.control));
      const order = g.contestants.slice(start).concat(g.contestants.slice(0, start));
      g.cell = { robin: cell.robin };
      g.robin = { order, active: order.slice(), turn: 0, out: [], named: 0, result: null };
      g.phase = 'robin';
    } else {
      g.cell = { c: cell.c, r: cell.r };
      g.phase = 'read';
    }
    g.buzz = null; g.buzzes = []; g.lockedOut = []; g.last = null;
  }

  function closeCell(g) {
    g.used[cellKey(g.cell)] = true;
    g.phase = 'answer';
  }

  function backToBoard(g) {
    g.cell = null; g.buzz = null; g.buzzes = []; g.lockedOut = []; g.robin = null;
    if (boardLeft(g) > 0) g.phase = 'board';
    else startFinal(g);
  }

  function startFinal(g) {
    g.cell = null;
    const finals = g.board.finals.map((f, k) => ({ f, k })).filter(x => x.f.q);
    if (!finals.length || !g.contestants.length) { g.phase = 'over'; return; }
    // Last place picks the final category (ties: whoever is listed first).
    const s = standings(g);
    const picker = s[s.length - 1].id;
    g.final = { picker, k: finals.length === 1 ? finals[0].k : null, wagers: {}, answers: {}, results: {} };
    g.phase = finals.length === 1 ? 'wager' : 'finalPick';
  }

  // Anyone can bet at least 5, so last place always has a comeback shot.
  function maxWager(g, pid) { return Math.max(5, g.scores[pid] || 0); }

  // Robin: after a ruling, move to the next player still in.
  function robinAdvance(g, ok) {
    const R = g.robin;
    const cur = R.active[R.turn];
    if (ok) {
      R.named++;
      R.turn = (R.turn + 1) % R.active.length;
    } else {
      R.out.push(cur);
      R.active.splice(R.turn, 1);
      if (R.turn >= R.active.length) R.turn = 0;
    }
    const finishAt = g.contestants.length >= 2 ? 1 : 0;
    if (R.active.length <= finishAt) {
      const winner = R.active[0] || null;
      const runnerUp = g.contestants.length >= 3 ? R.out[R.out.length - 1] : null;
      const awards = {};
      if (winner) awards[winner] = ROBIN_POINTS.winner;
      if (runnerUp) awards[runnerUp] = ROBIN_POINTS.runnerUp;
      for (const [pid, pts] of Object.entries(awards)) g.scores[pid] += pts;
      R.result = { winner, runnerUp, awards };
      if (winner) g.control = winner;
      g.used[cellKey(g.cell)] = true;
      g.phase = 'robinDone';
    }
  }

  // ---------------------------------------------------------------- intents
  // Handles one intent. Returns an error string, or '' when applied.
  function act(g, pid, msg, rng, now) {
    if (!g || !msg) return 'No game.';
    const host = isHost(g, pid);
    const player = isContestant(g, pid);
    switch (msg.t) {
      // ---- opening: closest to the host's secret number gets control
      case 'guess': {
        if (!player || g.phase !== 'guess') return 'Not now.';
        const n = Math.round(+msg.n);
        if (!(n >= 1 && n <= 100)) return 'Pick a number from 1 to 100.';
        g.opening.guesses[pid] = n;
        if (g.contestants.every(p => g.opening.guesses[p] != null)) resolveOpening(g);
        bump(g); return '';
      }
      case 'guessDone':
        if (!host || g.phase !== 'guess') return 'Not now.';
        resolveOpening(g); bump(g); return '';

      // ---- board
      case 'pick': {
        if (g.phase !== 'board') return 'Not now.';
        if (!host && pid !== g.control) return 'It\'s not your pick.';
        const cell = msg.robin != null ? { robin: msg.robin | 0 } : { c: msg.c | 0, r: msg.r | 0 };
        if (!cellOf(g, cell) || g.used[cellKey(cell)]) return 'That one\'s gone.';
        pickCell(g, cell); bump(g); return '';
      }
      case 'setControl':
        if (!host || !isContestant(g, msg.pid)) return 'Not allowed.';
        g.control = msg.pid; bump(g); return '';

      // ---- buzzers
      case 'buzz': {
        // Late buzzes still count for the "who was close behind" display.
        if (!player || (g.phase !== 'read' && g.phase !== 'buzzed')) return '';
        if (g.lockedOut.includes(pid) || g.buzzes.some(b => b.pid === pid)) return '';
        g.buzzes.push({ pid, at: now });
        if (!g.buzz) { g.buzz = pid; g.phase = 'buzzed'; }
        bump(g); return '';
      }
      case 'judge': {
        if (!host || g.phase !== 'buzzed') return 'Not now.';
        const v = cellValue(g);
        const who = g.buzz;
        g.scores[who] += msg.ok ? v : -v;
        g.last = { pid: who, ok: !!msg.ok, delta: msg.ok ? v : -v };
        if (msg.ok) { g.control = who; closeCell(g); }
        else {
          g.lockedOut.push(who);
          g.buzz = null; g.buzzes = [];
          if (g.contestants.every(p => g.lockedOut.includes(p))) closeCell(g);
          else g.phase = 'read';
        }
        bump(g); return '';
      }
      case 'resetBuzz':
        if (!host || (g.phase !== 'buzzed' && g.phase !== 'read')) return 'Not now.';
        g.buzz = null; g.buzzes = []; g.phase = 'read';
        bump(g); return '';
      case 'skip':
        if (!host || (g.phase !== 'read' && g.phase !== 'buzzed')) return 'Not now.';
        g.last = null; closeCell(g); bump(g); return '';
      case 'toBoard':
        if (!host || (g.phase !== 'answer' && g.phase !== 'robinDone')) return 'Not now.';
        backToBoard(g); bump(g); return '';

      // ---- round robin
      case 'robinJudge':
        if (!host || g.phase !== 'robin') return 'Not now.';
        robinAdvance(g, !!msg.ok); bump(g); return '';

      // ---- final gamble
      case 'toFinal':
        if (!host || g.phase !== 'board') return 'Not now.';
        startFinal(g); bump(g); return '';
      case 'finalPick': {
        if (g.phase !== 'finalPick') return 'Not now.';
        if (!host && pid !== g.final.picker) return 'Last place picks the final category.';
        const f = g.board.finals[msg.k | 0];
        if (!f || !f.q) return 'Not a category.';
        g.final.k = msg.k | 0; g.phase = 'wager';
        bump(g); return '';
      }
      case 'wager': {
        if (!player || g.phase !== 'wager') return 'Not now.';
        const n = Math.round(+msg.n);
        if (!(n >= 0 && n <= maxWager(g, pid))) return `You can wager 0 to ${maxWager(g, pid)}.`;
        g.final.wagers[pid] = n;
        bump(g); return '';
      }
      case 'finalQ':
        if (!host || g.phase !== 'wager') return 'Not now.';
        g.contestants.forEach(p => { if (g.final.wagers[p] == null) g.final.wagers[p] = 0; });
        g.phase = 'finalQ'; bump(g); return '';
      case 'finalAnswer': {
        if (!player || g.phase !== 'finalQ') return 'Not now.';
        g.final.answers[pid] = str(msg.text, 120) || '(blank)';
        bump(g); return '';
      }
      case 'finalReveal':
        if (!host || g.phase !== 'finalQ') return 'Not now.';
        g.contestants.forEach(p => { if (!g.final.answers[p]) g.final.answers[p] = '(no answer)'; });
        // Leader first, like the show.
        g.final.order = standings(g).map(s => s.id);
        g.phase = 'finalReveal'; bump(g); return '';
      case 'finalJudge': {
        if (!host || g.phase !== 'finalReveal') return 'Not now.';
        const next = g.final.order.find(p => !(p in g.final.results));
        if (!next) return 'Everyone\'s been revealed.';
        const w = g.final.wagers[next] || 0;
        g.final.results[next] = !!msg.ok;
        g.scores[next] += msg.ok ? w : -w;
        if (g.final.order.every(p => p in g.final.results)) g.phase = 'over';
        bump(g); return '';
      }

      // ---- host tools
      case 'adjust': {
        if (!host || !isContestant(g, msg.pid)) return 'Not allowed.';
        const d = Math.max(-10, Math.min(10, Math.round(+msg.d) || 0));
        g.scores[msg.pid] += d; bump(g); return '';
      }
      case 'say':
        if (!host) return 'Only the host can do that.';
        g.say = { text: str(msg.text, 200), at: now }; bump(g); return '';
      case 'end':
        if (!host) return 'Only the host can do that.';
        g.phase = 'over'; bump(g); return '';
    }
    return 'Unknown action.';
  }

  // ---------------------------------------------------------------- views
  // What one player may see. The host sees everything; contestants never get
  // answers before they're revealed, other players' secret wagers or final
  // answers early, or the opening number before it's resolved.
  function viewFor(g, pid) {
    if (!g) return null;
    const host = isHost(g, pid);
    const b = g.board;
    const cur = cellOf(g, g.cell);
    const showQ = host || g.showText || g.phase === 'answer';
    const v = {
      hostId: g.hostId, contestants: g.contestants, names: g.names, scores: g.scores,
      phase: g.phase, control: g.control, buzz: g.buzz, buzzes: g.buzzes, lockedOut: g.lockedOut,
      last: g.last, say: g.say, seq: g.seq, showText: g.showText,
      board: {
        cats: b.cats.map((c, ci) => ({ name: c.name, tag: c.tag, cells: c.cells.map((x, r) => ({ pts: POINTS[r], used: !!g.used[ci + '-' + r], blank: !x.q })) })),
        robins: b.robins.map((x, k) => ({ used: !!g.used['rr-' + k], blank: !x.q })),
      },
      opening: { guesses: g.phase === 'guess' && !host ? (g.opening.guesses[pid] != null ? { [pid]: g.opening.guesses[pid] } : {}) : g.opening.guesses,
        secret: g.phase === 'guess' && !host ? null : g.opening.secret, winner: g.opening.winner, guessed: Object.keys(g.opening.guesses) },
      cell: null,
      robin: g.robin,
      final: null,
    };
    if (g.cell && cur) {
      if (g.cell.robin != null) v.cell = { robin: g.cell.robin, q: cur.q, a: host || g.phase === 'robinDone' ? cur.a : null };
      else v.cell = { c: g.cell.c, r: g.cell.r, cat: b.cats[g.cell.c].name, pts: POINTS[g.cell.r], value: cellValue(g), fraud: cur.fraud,
        q: showQ ? cur.q : null, a: host || g.phase === 'answer' ? cur.a : null };
    }
    if (g.final) {
      const F = g.final, f = F.k != null ? b.finals[F.k] : null;
      const revealedAll = g.phase === 'over';
      const seen = p => host || p === pid || p in F.results || revealedAll;
      v.final = {
        picker: F.picker, k: F.k,
        cats: b.finals.map(x => (x.q ? x.cat : null)),
        cat: f ? f.cat : null,
        q: f && (g.phase === 'finalQ' || g.phase === 'finalReveal' || g.phase === 'over') ? f.q : null,
        a: f && (host || g.phase === 'over') ? f.a : null,
        wagered: Object.keys(F.wagers), answered: Object.keys(F.answers),
        wagers: Object.fromEntries(Object.entries(F.wagers).filter(([p]) => seen(p))),
        answers: Object.fromEntries(Object.entries(F.answers).filter(([p]) => seen(p))),
        results: F.results, order: F.order || null,
        max: maxWager(g, pid),
      };
    }
    return v;
  }

  const api = { STARTER, LIBRARY, randomBoard, withSpecialties, POINTS, ROBIN_POINTS, LIMITS, cleanBoard, boardStats, createGame, act, viewFor, standings, shuffle, clone };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.HGS = api;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
// Hell Is a Game Show: pixel art and chiptune. Everything is drawn in code at low
// resolution and scaled up with nearest-neighbour, so there are no image files.
(function () {
  'use strict';

  // ---------------------------------------------------------------- sprite kit
  // A sprite is a small grid of palette colours, built with shape helpers and then
  // given a 1px dark outline so it reads as pixel art.
  function grid(w, h) { return { w, h, px: new Array(w * h).fill(null) }; }
  function set(s, x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < s.w && y < s.h) s.px[y * s.w + x] = c; }
  function get(s, x, y) { return x >= 0 && y >= 0 && x < s.w && y < s.h ? s.px[y * s.w + x] : null; }
  function rect(s, x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(s, x + i, y + j, c); }
  function oval(s, cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) set(s, x, y, c);
      }
  }
  function outline(s, c) {
    const add = [];
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      if (get(s, x, y)) continue;
      if (get(s, x - 1, y) || get(s, x + 1, y) || get(s, x, y - 1) || get(s, x, y + 1)) add.push([x, y]);
    }
    add.forEach(([x, y]) => set(s, x, y, c));
    return s;
  }
  function toCanvas(s) {
    const c = document.createElement('canvas');
    c.width = s.w; c.height = s.h;
    const g = c.getContext('2d');
    for (let y = 0; y < s.h; y++) for (let x = 0; x < s.w; x++) {
      const col = s.px[y * s.w + x];
      if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); }
    }
    return c;
  }

  // ---------------------------------------------------------------- the demon
  const D = {
    ink: '#1a0508', skin: '#c63a2f', skinLo: '#8f2321', skinHi: '#e2574a',
    horn: '#eadfba', hornLo: '#b3a274', eye: '#ffd84a', bag: '#6d1a26',
    suit: '#2d2347', suitLo: '#1c1631', shirt: '#efe4d4', tie: '#ffb627', mouth: '#3d070d', tooth: '#fff6e8',
  };
  // frame: { eyes: 'bored' | 'shut' | 'wide', mouth: 'flat' | 'open' | 'smirk' }
  function demon(frame) {
    const s = grid(40, 44);
    // Suit and slumped shoulders.
    oval(s, 20, 44, 17, 12, D.suit);
    oval(s, 13, 40, 6, 6, D.suitLo);
    rect(s, 17, 32, 6, 12, D.shirt);
    rect(s, 19, 33, 2, 2, D.tie); rect(s, 18, 35, 4, 7, D.tie); rect(s, 19, 42, 2, 2, D.tie);
    set(s, 16, 33, D.suitLo); set(s, 23, 33, D.suitLo);
    // Neck.
    rect(s, 17, 27, 6, 5, D.skinLo);
    // Horns, curling out and up.
    const hornL = [[9, 12], [8, 11], [7, 10], [7, 9], [6, 8], [6, 7], [6, 6], [7, 5], [7, 4]];
    hornL.forEach(([x, y], k) => { rect(s, x, y, k < 4 ? 3 : 2, 2, D.horn); set(s, x + 1, y + 1, D.hornLo); });
    hornL.forEach(([x, y], k) => { rect(s, 39 - x - (k < 4 ? 3 : 2), y, k < 4 ? 3 : 2, 2, D.horn); set(s, 39 - x - 2, y + 1, D.hornLo); });
    // Head.
    oval(s, 20, 18, 10, 11, D.skin);
    oval(s, 23, 22, 6, 6, D.skinLo);  // jaw shadow
    oval(s, 20, 18, 9, 9, D.skin);
    oval(s, 16, 13, 3, 2, D.skinHi);  // forehead shine
    // Pointy ears.
    set(s, 9, 17, D.skin); set(s, 8, 16, D.skin); set(s, 8, 15, D.skinLo);
    set(s, 30, 17, D.skin); set(s, 31, 16, D.skin); set(s, 31, 15, D.skinLo);
    // Unibrow, flat and fed up.
    rect(s, 13, 15, 6, 1, D.ink); rect(s, 21, 15, 6, 1, D.ink);
    // Eyes.
    for (const ex of [14, 22]) {
      if (frame.eyes === 'shut') rect(s, ex, 18, 4, 1, D.ink);
      else if (frame.eyes === 'wide') { rect(s, ex, 16, 4, 3, D.eye); rect(s, ex + 1, 17, 2, 1, D.ink); }
      else { rect(s, ex, 17, 4, 2, D.eye); rect(s, ex, 17, 4, 1, D.skinLo); rect(s, ex + 1, 18, 2, 1, D.ink); }
      rect(s, ex, 19, 4, 1, D.bag); // eye bags: six thousand years of no sleep
    }
    // Nose.
    set(s, 19, 20, D.skinLo); set(s, 20, 21, D.skinLo);
    // Goatee.
    rect(s, 18, 27, 4, 2, D.ink); set(s, 19, 29, D.ink); set(s, 20, 29, D.ink);
    // Mouth.
    if (frame.mouth === 'open') { rect(s, 16, 23, 8, 3, D.mouth); rect(s, 17, 23, 2, 1, D.tooth); rect(s, 21, 23, 2, 1, D.tooth); }
    else if (frame.mouth === 'smirk') { rect(s, 16, 24, 7, 1, D.mouth); set(s, 23, 23, D.mouth); set(s, 22, 25, D.tooth); }
    else rect(s, 16, 24, 8, 1, D.mouth);
    return toCanvas(outline(s, D.ink));
  }

  // ---------------------------------------------------------------- souls
  function shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    const ch = k => Math.max(0, Math.min(255, Math.round(((n >> k) & 255) * f)));
    return '#' + [16, 8, 0].map(k => ch(k).toString(16).padStart(2, '0')).join('');
  }
  // mood: 'idle' | 'happy' | 'sad' | 'think'
  function soul(color, mood, wiggle) {
    const s = grid(16, 18);
    oval(s, 8, 7, 6.5, 6.5, color);
    rect(s, 2, 7, 13, 7, color);
    for (let x = 2; x < 15; x++) if (((x + wiggle) >> 1) % 2 === 0) set(s, x, 14, color);
    oval(s, 6, 4, 2, 1.5, shade(color, 1.35));
    rect(s, 11, 7, 3, 6, shade(color, 0.75));
    const ink = '#1a0508';
    if (mood === 'happy') { set(s, 5, 7, ink); set(s, 6, 6, ink); set(s, 7, 7, ink); set(s, 9, 7, ink); set(s, 10, 6, ink); set(s, 11, 7, ink); rect(s, 6, 10, 5, 1, ink); set(s, 5, 9, ink); set(s, 11, 9, ink); }
    else if (mood === 'sad') { rect(s, 5, 7, 2, 2, ink); rect(s, 10, 7, 2, 2, ink); rect(s, 6, 11, 5, 1, ink); set(s, 5, 12, ink); set(s, 11, 12, ink); set(s, 4, 9, '#7fd4ff'); }
    else if (mood === 'think') { rect(s, 5, 7, 2, 2, ink); rect(s, 10, 6, 2, 2, ink); rect(s, 7, 11, 3, 1, ink); }
    else { rect(s, 5, 7, 2, 2, ink); rect(s, 10, 7, 2, 2, ink); rect(s, 7, 11, 3, 1, ink); }
    return toCanvas(outline(s, ink));
  }

  // ---------------------------------------------------------------- studio
  const W = 320, H = 150;
  function Stage(canvas) {
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d');
    g.imageSmoothingEnabled = false;
    const frames = {
      bored: demon({ eyes: 'bored', mouth: 'flat' }),
      blink: demon({ eyes: 'shut', mouth: 'flat' }),
      talk: demon({ eyes: 'bored', mouth: 'open' }),
      smirk: demon({ eyes: 'bored', mouth: 'smirk' }),
      wide: demon({ eyes: 'wide', mouth: 'open' }),
    };
    const soulCache = {};
    const soulImg = (color, mood, w) => soulCache[color + mood + w] || (soulCache[color + mood + w] = soul(color, mood, w));
    const embers = Array.from({ length: 26 }, () => ({ x: Math.random() * W, y: H - Math.random() * 60, v: 6 + Math.random() * 10 }));
    let scene = { players: [], talkingUntil: 0, mood: 'bored', shakeUntil: 0, flash: null };
    let last = performance.now();

    // Back wall: a pleated curtain with a lava glow along the bottom.
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;
    (function paintBackdrop() {
      const b = bg.getContext('2d');
      for (let x = 0; x < W; x++) {
        const fold = Math.sin(x / 5) * 0.5 + 0.5;
        const r = Math.round(70 + fold * 40), gg = Math.round(10 + fold * 8), bb = Math.round(18 + fold * 8);
        b.fillStyle = `rgb(${r},${gg},${bb})`;
        b.fillRect(x, 0, 1, 112);
      }
      // Pelmet with scalloped edge.
      b.fillStyle = '#2a0710'; b.fillRect(0, 0, W, 12);
      for (let x = 0; x < W; x += 16) { b.beginPath(); b.arc(x + 8, 12, 8, 0, Math.PI); b.fill(); }
      b.fillStyle = '#ffb627'; b.fillRect(0, 11, W, 1);
      // Stage floor: dark checks fading into the lava pit.
      for (let y = 112; y < H; y++) for (let x = 0; x < W; x += 8) {
        const even = ((x >> 3) + (y >> 3)) % 2 === 0;
        b.fillStyle = even ? '#241016' : '#1a0a0f';
        b.fillRect(x, y, 8, 1);
      }
      b.fillStyle = '#ff7a2a'; b.fillRect(0, 112, W, 1);
      for (let k = 0; k < 10; k++) { b.fillStyle = `rgba(255,${80 + k * 10},40,${0.09 - k * 0.008})`; b.fillRect(0, H - 1 - k * 2, W, 2); }
    })();

    function bulbs(t) {
      for (let x = 6; x < W; x += 12) {
        const on = (Math.floor(t / 300) + x / 12) % 3 !== 0;
        g.fillStyle = on ? '#ffd84a' : '#6b4a12';
        g.fillRect(x, 3, 3, 3);
        if (on) { g.fillStyle = 'rgba(255,216,74,.25)'; g.fillRect(x - 1, 2, 5, 5); }
      }
    }
    function torch(x, t) {
      g.fillStyle = '#3a2a2a'; g.fillRect(x - 3, 90, 7, 22);
      g.fillStyle = '#1a0508'; g.fillRect(x - 4, 88, 9, 3);
      for (let k = 0; k < 18; k++) {
        const fx = x + Math.round(Math.sin(t / 90 + k * 1.7) * 3);
        const fy = 87 - Math.round(((t / 40 + k * 13) % 18));
        g.fillStyle = k % 3 === 0 ? '#ffd84a' : k % 3 === 1 ? '#ff7a2a' : '#e0281e';
        g.fillRect(fx, fy, 2, 2);
      }
    }
    function desk() {
      g.fillStyle = '#1a0508'; g.fillRect(14, 96, 84, 18);
      g.fillStyle = '#4b1520'; g.fillRect(15, 97, 82, 16);
      g.fillStyle = '#ffb627'; g.fillRect(15, 97, 82, 2);
      g.fillStyle = '#6a1e2b'; for (let x = 19; x < 96; x += 10) g.fillRect(x, 101, 6, 9);
    }
    function podium(x, color, glow, w) {
      const h = w >> 1;
      g.fillStyle = '#1a0508'; g.fillRect(x - h - 1, 96, w + 2, 18);
      g.fillStyle = shade(color, 0.45); g.fillRect(x - h, 97, w, 16);
      g.fillStyle = color; g.fillRect(x - h, 97, w, 2);
      if (glow) { g.fillStyle = 'rgba(255,216,74,.8)'; g.fillRect(x - h + 4, 104, w - 8, 3); g.fillStyle = 'rgba(255,216,74,.18)'; g.fillRect(x - h - 4, 60, w + 8, 36); }
    }
    const seen = {};
    const confetti = [];

    function draw(t) {
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      const shake = t < scene.shakeUntil ? Math.round(Math.sin(t / 25) * 2) : 0;
      g.setTransform(1, 0, 0, 1, shake, 0);
      g.drawImage(bg, 0, 0);
      bulbs(t);
      torch(6, t); torch(W - 7, t + 400);
      // Demon behind the desk.
      const blinking = (t % 4200) < 140;
      const talking = t < scene.talkingUntil;
      let img = frames.bored;
      if (talking) img = Math.floor(t / 140) % 2 ? frames.talk : frames.bored;
      else if (scene.mood === 'smirk') img = frames.smirk;
      else if (scene.mood === 'wide') img = frames.wide;
      if (blinking && !talking) img = frames.blink;
      const bob = Math.floor(t / 900) % 2;
      g.drawImage(img, 36, 56 + bob, 40, 44);
      desk();
      // Contestants.
      const ps = scene.players;
      const xs = podiumXs(ps.length);
      const pw = Math.min(22, Math.floor(podiumGap(ps.length)) - 2);
      ps.forEach((p, k) => {
        const x = xs[k];
        podium(x, p.color, p.answered, pw);
        let y = 78 + Math.round(Math.sin(t / 400 + k) * 1.5);
        // New arrivals drop in from the rafters.
        if (seen[p.id] == null) seen[p.id] = t;
        const age = (t - seen[p.id]) / 450;
        if (age < 1) y -= Math.round(70 * (1 - age) * (1 - age));
        if (p.falling) y += Math.min(90, (t - p.falling) / 6);
        if (p.falling && t - p.falling < 120) { g.fillStyle = '#000'; g.fillRect(x - 9, 95, 18, 3); }
        if (p.bet) { // soul bet aura
          for (let a = 0; a < 6; a++) { g.fillStyle = a % 2 ? '#ff7a2a' : '#ffd84a'; g.fillRect(x - 9 + ((t / 60 + a * 5) % 18), y - 2 + ((a * 7) % 6), 2, 2); }
        }
        g.drawImage(soulImg(p.color, p.mood || 'idle', Math.floor(t / 200) % 4), x - 8, y);
        if (p.connected === false) { g.fillStyle = 'rgba(18,6,10,.65)'; g.fillRect(x - 9, y - 1, 18, 20); }
      });
      if (!ps.length) { g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(150, 100, 140, 2); }
      // Embers drifting up from the pit.
      embers.forEach(e => {
        e.y -= e.v * dt; e.x += Math.sin((t / 700) + e.v) * 0.2;
        if (e.y < 14) { e.y = H; e.x = Math.random() * W; }
        g.fillStyle = e.v > 12 ? '#ffd84a' : '#ff7a2a';
        g.fillRect(Math.round(e.x), Math.round(e.y), 1, 1);
      });
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.vy += 60 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
        if (c.y > H) { confetti.splice(i, 1); continue; }
        g.fillStyle = c.c;
        g.fillRect(Math.round(c.x), Math.round(c.y), (t / 80 + i) % 4 < 2 ? 2 : 1, 2);
      }
      if (scene.flash && t < scene.flash.until) {
        g.fillStyle = scene.flash.color; g.globalAlpha = (scene.flash.until - t) / 600;
        g.fillRect(0, 0, W, H); g.globalAlpha = 1;
      }
      g.setTransform(1, 0, 0, 1, 0, 0);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    return {
      set(next) { scene = Object.assign(scene, next); },
      talk(ms) { scene.talkingUntil = performance.now() + ms; },
      shake(ms = 400) { scene.shakeUntil = performance.now() + ms; },
      flash(color) { scene.flash = { color, until: performance.now() + 600 }; },
      burst(colors) {
        for (let i = 0; i < 160; i++) confetti.push({ x: Math.random() * W, y: -Math.random() * 40, vx: (Math.random() - 0.5) * 40, vy: Math.random() * 30, c: colors[i % colors.length] });
      },
      now: () => performance.now(),
    };
  }

  // Contestant podiums sit in a tight group to the right of the host's desk,
  // centred, so two players stand together rather than at opposite walls.
  const GROUP_CENTRE = 208, GROUP_SPAN = 192;
  function podiumGap(n) { return Math.min(34, GROUP_SPAN / Math.max(1, n)); }
  function podiumXs(n) {
    const gap = podiumGap(n);
    return Array.from({ length: n }, (_, k) => Math.round(GROUP_CENTRE + (k - (n - 1) / 2) * gap));
  }

  // ---------------------------------------------------------------- flags
  // Drawn at 45x30 and scaled up, so they match the pixel look.
  function drawFlag(canvas, f) {
    const w = 45, h = 30;
    canvas.width = w; canvas.height = h;
    const g = canvas.getContext('2d');
    if (f.kind === 'v' || f.kind === 'h') {
      const r = f.r || f.c.map(() => 1), tot = r.reduce((a, b) => a + b, 0);
      let at = 0;
      f.c.forEach((col, k) => {
        const len = f.kind === 'v' ? w : h;
        const from = Math.round(at / tot * len); at += r[k];
        const to = Math.round(at / tot * len);
        g.fillStyle = col;
        if (f.kind === 'v') g.fillRect(from, 0, to - from, h); else g.fillRect(0, from, w, to - from);
      });
    } else if (f.kind === 'disc') {
      g.fillStyle = f.bg; g.fillRect(0, 0, w, h);
      const cx = w / 2 + (f.offset || 0) * w, cy = h / 2, rr = h * 0.3;
      g.fillStyle = f.c;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= rr * rr) g.fillRect(x, y, 1, 1);
    } else if (f.kind === 'nordic') {
      g.fillStyle = f.bg; g.fillRect(0, 0, w, h);
      if (f.border) { g.fillStyle = f.border; g.fillRect(11, 0, 8, h); g.fillRect(0, 11, w, 8); }
      g.fillStyle = f.cross; g.fillRect(13, 0, 4, h); g.fillRect(0, 13, w, 4);
    } else if (f.kind === 'swiss') {
      canvas.width = 30; canvas.height = 30;
      g.fillStyle = f.bg; g.fillRect(0, 0, 30, 30);
      g.fillStyle = f.cross; g.fillRect(12, 6, 6, 18); g.fillRect(6, 12, 18, 6);
    }
  }

  // ---------------------------------------------------------------- chiptune
  // Notes are "name:beats"; R is a rest. Public-domain melodies only.
  const TUNES = {
    twinkle: { bpm: 110, n: 'C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2' },
    birthday: { bpm: 100, n: 'G4:.75 G4:.25 A4 G4 C5 B4:2 G4:.75 G4:.25 A4 G4 D5 C5:2' },
    jingle: { bpm: 150, n: 'E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4' },
    lamb: { bpm: 120, n: 'E4 D4 C4 D4 E4 E4 E4:2 D4 D4 D4:2 E4 G4 G4:2' },
    ode: { bpm: 120, n: 'E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2' },
    elise: { bpm: 90, n: 'E5:.5 D#5:.5 E5:.5 D#5:.5 E5:.5 B4:.5 D5:.5 C5:.5 A4:1.5 R:.5 C4:.5 E4:.5 A4:.5 B4:1.5 R:.5 E4:.5 G#4:.5 B4:.5 C5:1.5' },
    mountain: { bpm: 140, n: 'B3 C#4 D4 E4 F#4 D4 F#4:2 F4 C#4 F4:2 E4 C4 E4:2 B3 C#4 D4 E4 F#4 D4 F#4 B4 A4 F#4 D4 F#4 A4:3' },
    bride: { bpm: 80, n: 'C4 F4:.75 F4:.25 F4:2 C4 G4:.75 E4:.25 F4:2' },
    toccata: { bpm: 70, n: 'A5:.25 G5:.25 A5:2 G5:.25 F5:.25 E5:.25 D5:.25 C#5:1 D5:2 R:.5 A4:.25 G4:.25 A4:2 E4:.5 F4:.5 C#4:.5 D4:2' },
    funeral: { bpm: 60, n: 'A#3 A#3:.75 A#3:.25 A#3 C#4:.75 C4:.25 C4:.75 A#3:.25 A#3:.75 A3:.25 A#3:2' },
    lullaby: { bpm: 100, n: 'E4:.5 E4:.5 G4:1.5 E4:.5 E4:.5 G4:1.5 E4:.5 G4:.5 C5 B4:1.5 A4:.5 A4 G4:2' },
  };
  const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
  function freq(name) {
    const m = /^([A-G]#?)(\d)$/.exec(name);
    if (!m) return 0;
    return 440 * Math.pow(2, (SEMI[m[1]] + (+m[2] + 1) * 12 - 69) / 12);
  }
  let ctx = null;
  function audio() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  let tuneNodes = [];
  function stopTune() { tuneNodes.forEach(n => { try { n.stop(); } catch (e) { /* already stopped */ } }); tuneNodes = []; }
  function playTune(key, vol = 0.15) {
    const a = audio(), tune = TUNES[key];
    if (!a || !tune) return 0;
    stopTune();
    const beat = 60 / tune.bpm;
    let t = a.currentTime + 0.05;
    for (const tok of tune.n.split(/\s+/)) {
      const [name, b] = tok.split(':');
      const dur = (b ? parseFloat(b) : 1) * beat;
      const f = freq(name);
      if (f) {
        const o = a.createOscillator(), gn = a.createGain();
        o.type = 'square'; o.frequency.value = f;
        gn.gain.setValueAtTime(0, t);
        gn.gain.linearRampToValueAtTime(vol, t + 0.01);
        gn.gain.setValueAtTime(vol, t + dur * 0.75);
        gn.gain.linearRampToValueAtTime(0, t + dur * 0.95);
        o.connect(gn).connect(a.destination);
        o.start(t); o.stop(t + dur);
        tuneNodes.push(o);
      }
      t += dur;
    }
    return t - a.currentTime;
  }
  // A snare roll for dramatic reveals.
  function drumroll(seconds = 1.6, vol = 0.25) {
    const a = audio();
    if (!a) return;
    const len = Math.floor(a.sampleRate * 0.05);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    for (let t = 0; t < seconds; t += 0.055) {
      const src = a.createBufferSource(), gn = a.createGain();
      src.buffer = buf;
      gn.gain.value = vol * (0.4 + 0.6 * t / seconds);
      src.connect(gn).connect(a.destination);
      src.start(a.currentTime + t);
    }
  }

  // ---------------------------------------------------------------- music
  // An original, low-key loop for the lobby and the board: a creeping minor bass
  // with a ticking hi-hat. Scheduled a bar ahead so timer jitter can't stutter it.
  const LOOP = { bpm: 104, bass: 'A2 A2 C3 A2 F2 F2 E2 E2 A2 A2 C3 D3 E3 D3 C3 B2', lead: 'R R E4 R R C4 R R R R E4 R F4 E4 D4 R' };
  let musicTimer = null, musicNext = 0, musicStep = 0, musicGain = null;
  function noteAt(a, f, t, dur, type, vol, dest) {
    const o = a.createOscillator(), gn = a.createGain();
    o.type = type; o.frequency.value = f;
    gn.gain.setValueAtTime(0, t);
    gn.gain.linearRampToValueAtTime(vol, t + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function music(on) {
    const a = audio();
    if (!a) return;
    if (!on) { clearInterval(musicTimer); musicTimer = null; if (musicGain) musicGain.gain.setTargetAtTime(0, a.currentTime, 0.2); return; }
    if (musicTimer) return;
    musicGain = a.createGain(); musicGain.gain.value = 0.5; musicGain.connect(a.destination);
    const bass = LOOP.bass.split(' '), lead = LOOP.lead.split(' ');
    const step = 60 / LOOP.bpm / 2;
    musicNext = a.currentTime + 0.1;
    const dest = musicGain;
    musicTimer = setInterval(() => {
      while (musicNext < a.currentTime + 0.6) {
        const k = musicStep % bass.length;
        const fb = freq(bass[k]);
        if (fb) noteAt(a, fb, musicNext, step * 0.9, 'triangle', 0.09, dest);
        const fl = freq(lead[k]);
        if (fl) noteAt(a, fl, musicNext, step * 1.6, 'square', 0.025, dest);
        if (k % 2 === 1) noteAt(a, 6000 + Math.random() * 2000, musicNext, 0.03, 'square', 0.008, dest);
        musicNext += step; musicStep++;
      }
    }, 150);
  }

  window.HGSArt = { Stage, drawFlag, playTune, stopTune, drumroll, audio, music, soul, demon, podiumXs, W, H };
})();
